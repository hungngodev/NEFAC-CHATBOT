version: "3.8"

volumes:
  esdata:
    name: nefac_es-data
  qdrant-data:
    name: nefac_qdrant-data
  neo4j-data:
    name: nefac_neo4j-data
  postgres-data:
    name: nefac_postgres-data
  redis-data:
    name: nefac_redis-data
  kibana-data:
    name: nefac_kibana-data
  nginx-logs:
    name: nefac_nginx-logs
  neo4j-plugins:
    name: nefac_neo4j-plugins
  neo4j-logs:
    name: nefac_neo4j-logs

networks:
  nefacnet:
    driver: bridge

services:
  # --- Databases & Infrastructure ---

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    container_name: nefac-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ../backup:/usr/share/elasticsearch/snapshots
    networks:
      - nefacnet
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.2
    container_name: nefac-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=a7a6311933d3503b89bc2dbc36572c33a6c10925682e591bffcab6911c06786d
    volumes:
      - kibana-data:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nefacnet

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nefac-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - nefacnet
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 10s
      retries: 5

  neo4j:
    image: neo4j:latest
    container_name: nefac-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-plugins:/plugins
      - neo4j-logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
    networks:
      - nefacnet
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:6
    container_name: nefac-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 1s
      retries: 5
    volumes:
      - redis-data:/data
    networks:
      - nefacnet

  postgres:
    image: postgres:16
    container_name: nefac-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      start_period: 10s
      timeout: 1s
      retries: 5
      interval: 5s
    networks:
      - nefacnet

  # --- Application ---

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: nefac-backend
    container_name: nefac-backend
    ports:
      - "8123:8000"
    volumes:
      - ../backend:/deps/backend
    depends_on:
      elasticsearch:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Override hostnames to point to docker service names
      - REDIS_URI=redis://redis:6379/0
      - POSTGRES_URI=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      - ES_HOST=http://elasticsearch:9200
      - QDRANT_ENDPOINT=http://qdrant:6333
      - NEO4J_URI=bolt://neo4j:7687
      # Ensure these match the service names/auth
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - LANGGRAPH_CHECKPOINTER={"type":"langgraph_checkpoint_postgres.PostgresSaver","kwargs":{"conn_string":"postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable"}}
    networks:
      - nefacnet

  nginx:
    image: nginx:alpine
    container_name: nefac-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - nefacnet

  frontend:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_ASSISTANT_ID: agent
    container_name: nefac-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_ASSISTANT_ID=agent
    depends_on:
      backend:
        condition: service_started
    networks:
      - nefacnet

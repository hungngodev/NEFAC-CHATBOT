[project]
name = "backend"
package-mode = false
version = "0.1.0"
description = "NEFAC Multi-Agent Research System"
authors = [
    {name = "HUNG NGO", email = "hungngo1607@gmail.com"}
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "pydantic (>=2.11.7,<3.0.0)",
    "langgraph (>=0.5.4,<0.6.0)",
    "langchain (>=0.3.26,<0.4.0)",
    "langmem (>=0.0.28,<0.0.29)",
    "langchain-neo4j (>=0.4.0,<0.5.0)",
    "langchain-community (>=0.3.27,<0.4.0)",
    "langchain-cohere (<0.3.5)",
    "langchain-qdrant (>=0.2.0,<0.3.0)",
    "qdrant-client (>=1.15.0,<2.0.0)",
    "langchain-mcp-adapters (>=0.1.9,<0.2.0)",
    "tavily-python (>=0.7.10,<0.8.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "selenium (>=4.34.2,<5.0.0)",
    "youtube-transcript-api (>=1.2.1,<2.0.0)",
    "yt-dlp (>=2025.7.21,<2026.0.0)",
    "langchain-ollama (>=0.3.6,<0.4.0)",
    "langchain-experimental (>=0.3.4,<0.4.0)",
    "langgraph-cli (>=0.3.5,<0.4.0)",
    "langgraph-api (>=0.2.100,<0.3.0)",
    "elasticsearch (>=9.0.2,<10.0.0)",
    "mcp-graphql (>=0.3.0,<0.4.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
autoflake = "^2.3.1"
black = "^24.4.2"
pre-commit = "^3.7.1"
ruff = "^0.4.8"

[tool.black]
line-length = 300
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | faiss_store
  | docs
  | .*\.pkl
  | .*\.pdf
  | .*\.txt
)/
'''

[tool.ruff]
line-length = 300
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "faiss_store",
    "docs",
    "*.pkl",
    "*.pdf",
    "*.txt",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "W291"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
